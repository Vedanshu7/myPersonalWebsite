  <g font-family="monospace" font-size="11" fill="#7d8590">
    <rect x="56" y="392" width="54" height="22" rx="3" fill="#21262d"/>
    <text x="83" y="407" text-anchor="middle">Java</text>
    <rect x="118" y="392" width="103" height="22" rx="3" fill="#21262d"/>
    <text x="169.5" y="407" text-anchor="middle">Spring Boot</text>
    <rect x="229" y="392" width="54" height="22" rx="3" fill="#21262d"/>
    <text x="256" y="407" text-anchor="middle">gRPC</text>
    <rect x="291" y="392" width="61" height="22" rx="3" fill="#21262d"/>
    <text x="321.5" y="407" text-anchor="middle">MySQL</text>
    <rect x="360" y="392" width="96" height="22" rx="3" fill="#21262d"/>
    <text x="408" y="407" text-anchor="middle">Kubernetes</text>
