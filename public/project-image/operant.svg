<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Operant, Learn the task once. Replay it without the model.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="#f472b6"/>

  <text x="56" y="72" font-family="monospace" font-size="12" fill="#f472b6" letter-spacing="4">COMPUTER USE AGENT</text>
  <text x="56" y="120" font-family="monospace" font-size="42" font-weight="bold" fill="#e6edf3">Operant</text>
  <text x="56" y="152" font-family="monospace" font-size="15" fill="#7d8590">Learn the task once. Replay it without the model.</text>

  <g font-family="monospace" font-size="11">
    <rect x="56" y="214" width="96" height="52" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="104" y="240" text-anchor="middle" fill="#7d8590" font-size="11">app</text>
    <text x="104" y="256" text-anchor="middle" fill="#484f58" font-size="10">no API</text>
    <path d="M152 240 H 190" stroke="#30363d" stroke-width="1.5"/>
    <path d="M184 236 l6 4 -6 4z" fill="#30363d"/>
    <rect x="190" y="196" width="104" height="40" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="242" y="220" text-anchor="middle" fill="#c9d1d9" font-size="11">model</text>
    <text x="242" y="254" text-anchor="middle" fill="#484f58" font-size="10">drives the screen</text>
    <text x="242" y="268" text-anchor="middle" fill="#484f58" font-size="10">macOS a11y tree</text>
    <path d="M294 216 C 315 216, 315 240, 336 240" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <path d="M330 236 l6 4 -6 4z" fill="#30363d"/>
    <rect x="336" y="196" width="140" height="92" rx="6" fill="#0d1117" stroke="#f472b6"/>
    <text x="406" y="220" text-anchor="middle" fill="#f472b6" font-size="12">capability</text>
    <line x1="350" y1="234" x2="462" y2="234" stroke="#21262d"/>
    <text x="406" y="252" text-anchor="middle" fill="#7d8590" font-size="10">typed in / out</text>
    <text x="406" y="270" text-anchor="middle" fill="#7d8590" font-size="10">steps · checkpoints</text>
    <path d="M476 220 C 498 220, 498 186, 520 186" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <path d="M514 182 l6 4 -6 4z" fill="#30363d"/>
    <path d="M476 264 C 498 264, 498 300, 520 300" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <path d="M514 296 l6 4 -6 4z" fill="#30363d"/>
    <rect x="520" y="166" width="118" height="40" rx="5" fill="#161b22" stroke="#f472b6"/>
    <text x="579" y="190" text-anchor="middle" fill="#f472b6" font-size="11">replay</text>
    <text x="579" y="220" text-anchor="middle" fill="#484f58" font-size="10">no model in the loop</text>
    <rect x="520" y="280" width="118" height="40" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="579" y="304" text-anchor="middle" fill="#c9d1d9" font-size="11">approve</text>
    <text x="579" y="334" text-anchor="middle" fill="#484f58" font-size="10">risky steps pause</text>
    <path d="M638 186 H 676" stroke="#30363d" stroke-width="1.5"/>
    <path d="M670 182 l6 4 -6 4z" fill="#30363d"/>
    <rect x="676" y="166" width="68" height="40" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="710" y="190" text-anchor="middle" fill="#c9d1d9" font-size="11">done</text>
    <text x="56" y="300" text-anchor="start" fill="#484f58" font-size="10">$secret:name resolved late, never shown to the model</text>
  </g>

  <g font-family="monospace" font-size="11" fill="#7d8590">
    <rect x="56" y="392" width="68" height="22" rx="3" fill="#21262d"/>
    <text x="90" y="407" text-anchor="middle">Python</text>
    <rect x="132" y="392" width="96" height="22" rx="3" fill="#21262d"/>
    <text x="180" y="407" text-anchor="middle">TypeScript</text>
    <rect x="236" y="392" width="75" height="22" rx="3" fill="#21262d"/>
    <text x="273.5" y="407" text-anchor="middle">Node.js</text>
    <rect x="319" y="392" width="61" height="22" rx="3" fill="#21262d"/>
    <text x="349.5" y="407" text-anchor="middle">macOS</text>
  </g>
</svg>
