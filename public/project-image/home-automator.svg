<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="home-automator — Android app and Arduino firmware controlling relays over local WiFi">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="#a3e635"/>

  <text x="56" y="72" font-family="monospace" font-size="12" fill="#a3e635" letter-spacing="4">IOT</text>
  <text x="56" y="120" font-family="monospace" font-size="42" font-weight="bold" fill="#e6edf3">home-automator</text>
  <text x="56" y="152" font-family="monospace" font-size="15" fill="#7d8590">Phone to relay, over local WiFi. No cloud.</text>

  <g font-family="monospace" font-size="11">
    <rect x="56" y="200" width="100" height="130" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="70" y="214" width="72" height="90" rx="4" fill="#0d1117" stroke="#30363d"/>
    <circle cx="106" cy="314" r="6" fill="none" stroke="#30363d"/>
    <text x="106" y="345" text-anchor="middle" fill="#c9d1d9" font-size="10">Android</text>

    <path d="M156 258 H 220" stroke="#a3e635" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="188" y="248" text-anchor="middle" fill="#a3e635" font-size="9">TCP · WiFi</text>

    <rect x="220" y="228" width="120" height="60" rx="6" fill="#0d1117" stroke="#a3e635"/>
    <text x="280" y="253" text-anchor="middle" fill="#a3e635" font-size="11">ESP8266</text>
    <text x="280" y="271" text-anchor="middle" fill="#484f58" font-size="9">local network</text>

    <path d="M340 258 H 378" stroke="#30363d" stroke-width="1.5"/>
    <rect x="378" y="228" width="120" height="60" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="438" y="253" text-anchor="middle" fill="#c9d1d9" font-size="11">Arduino</text>
    <text x="438" y="271" text-anchor="middle" fill="#484f58" font-size="9">+ DS3231 RTC</text>

    <!-- 4 relay outputs -->
    <path d="M498 258 H 536" stroke="#30363d" stroke-width="1.5"/>
    <path d="M536 258 V 220" stroke="#30363d" stroke-width="1.2"/>
    <path d="M536 258 V 296" stroke="#30363d" stroke-width="1.2"/>

    <rect x="536" y="196" width="90" height="30" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="581" y="216" text-anchor="middle" fill="#c9d1d9" font-size="9">Light</text>
    <rect x="536" y="230" width="90" height="30" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="581" y="250" text-anchor="middle" fill="#c9d1d9" font-size="9">Fan</text>
    <rect x="536" y="264" width="90" height="30" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="581" y="284" text-anchor="middle" fill="#c9d1d9" font-size="9">AC</text>
    <rect x="536" y="298" width="90" height="30" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="581" y="318" text-anchor="middle" fill="#c9d1d9" font-size="9">Relay 4</text>
  </g>

  <g font-family="monospace" font-size="11" fill="#7d8590">
    <rect x="56" y="392" width="72" height="22" rx="3" fill="#21262d"/><text x="92" y="407" text-anchor="middle">Android</text>
    <rect x="136" y="392" width="72" height="22" rx="3" fill="#21262d"/><text x="172" y="407" text-anchor="middle">Arduino</text>
  </g>
</svg>
