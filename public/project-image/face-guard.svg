<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Face Guard, Who opened your laptop?">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="#fb923c"/>

  <text x="56" y="72" font-family="monospace" font-size="12" fill="#fb923c" letter-spacing="4">SECURITY TOOL</text>
  <text x="56" y="120" font-family="monospace" font-size="42" font-weight="bold" fill="#e6edf3">Face Guard</text>
  <text x="56" y="152" font-family="monospace" font-size="15" fill="#7d8590">Who opened your laptop?</text>

  <g font-family="monospace" font-size="11">
    <rect x="56" y="214" width="118" height="52" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="115" y="240" text-anchor="middle" fill="#c9d1d9" font-size="11">boot</text>
    <text x="115" y="256" text-anchor="middle" fill="#484f58" font-size="10">Task Scheduler</text>
    <path d="M174 240 H 212" stroke="#30363d" stroke-width="1.5"/>
    <path d="M206 236 l6 4 -6 4z" fill="#30363d"/>
    <rect x="212" y="214" width="118" height="52" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="271" y="240" text-anchor="middle" fill="#c9d1d9" font-size="11">webcam</text>
    <text x="271" y="256" text-anchor="middle" fill="#484f58" font-size="10">capture frame</text>
    <path d="M330 240 H 368" stroke="#30363d" stroke-width="1.5"/>
    <path d="M362 236 l6 4 -6 4z" fill="#30363d"/>
    <rect x="368" y="196" width="152" height="92" rx="6" fill="#0d1117" stroke="#fb923c"/>
    <text x="444" y="220" text-anchor="middle" fill="#fb923c" font-size="12">Haar cascade</text>
    <line x1="382" y1="234" x2="506" y2="234" stroke="#21262d"/>
    <text x="444" y="252" text-anchor="middle" fill="#7d8590" font-size="10">face detected</text>
    <text x="444" y="270" text-anchor="middle" fill="#7d8590" font-size="10">OpenCV</text>
    <path d="M520 220 C 547 220, 547 186, 574 186" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <path d="M568 182 l6 4 -6 4z" fill="#30363d"/>
    <path d="M520 264 C 547 264, 547 300, 574 300" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <path d="M568 296 l6 4 -6 4z" fill="#30363d"/>
    <rect x="574" y="166" width="170" height="40" rx="5" fill="#161b22" stroke="#fb923c"/>
    <text x="659" y="190" text-anchor="middle" fill="#fb923c" font-size="11">email</text>
    <text x="659" y="220" text-anchor="middle" fill="#484f58" font-size="10">Gmail SMTP</text>
    <rect x="574" y="280" width="170" height="40" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="659" y="304" text-anchor="middle" fill="#c9d1d9" font-size="11">archive</text>
    <text x="659" y="334" text-anchor="middle" fill="#484f58" font-size="10">timestamped locally</text>
  </g>

  <g font-family="monospace" font-size="11" fill="#7d8590">
    <rect x="56" y="392" width="68" height="22" rx="3" fill="#21262d"/>
    <text x="90" y="407" text-anchor="middle">Python</text>
    <rect x="132" y="392" width="68" height="22" rx="3" fill="#21262d"/>
    <text x="166" y="407" text-anchor="middle">OpenCV</text>
  </g>
</svg>
