<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="gitpatch, Rewrite commit dates without the CLI.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="#facc15"/>

  <text x="56" y="72" font-family="monospace" font-size="12" fill="#facc15" letter-spacing="4">DESKTOP APPLICATION</text>
  <text x="56" y="120" font-family="monospace" font-size="42" font-weight="bold" fill="#e6edf3">gitpatch</text>
  <text x="56" y="152" font-family="monospace" font-size="15" fill="#7d8590">Rewrite commit dates without the CLI.</text>

  <g font-family="monospace" font-size="11">
    <rect x="56" y="214" width="122" height="52" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="117" y="240" text-anchor="middle" fill="#c9d1d9" font-size="11">local repo</text>
    <text x="117" y="256" text-anchor="middle" fill="#484f58" font-size="10">git on PATH</text>
    <path d="M178 240 H 216" stroke="#30363d" stroke-width="1.5"/>
    <path d="M210 236 l6 4 -6 4z" fill="#30363d"/>
    <rect x="216" y="196" width="150" height="88" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="291" y="244" text-anchor="middle" fill="#c9d1d9" font-size="11">commit list</text>
    <text x="291" y="240" text-anchor="middle" fill="#484f58" font-size="10">browse history</text>
    <text x="291" y="256" text-anchor="middle" fill="#484f58" font-size="10">pick any commit</text>
    <path d="M366 240 H 404" stroke="#30363d" stroke-width="1.5"/>
    <path d="M398 236 l6 4 -6 4z" fill="#30363d"/>
    <rect x="404" y="196" width="160" height="92" rx="6" fill="#0d1117" stroke="#facc15"/>
    <text x="484" y="220" text-anchor="middle" fill="#facc15" font-size="12">rewrite</text>
    <line x1="418" y1="234" x2="550" y2="234" stroke="#21262d"/>
    <text x="484" y="252" text-anchor="middle" fill="#7d8590" font-size="10">author date</text>
    <text x="484" y="270" text-anchor="middle" fill="#7d8590" font-size="10">committer date</text>
    <path d="M564 240 H 602" stroke="#30363d" stroke-width="1.5"/>
    <path d="M596 236 l6 4 -6 4z" fill="#30363d"/>
    <rect x="602" y="214" width="142" height="52" rx="5" fill="#161b22" stroke="#facc15"/>
    <text x="673" y="240" text-anchor="middle" fill="#facc15" font-size="11">force-push</text>
    <text x="673" y="256" text-anchor="middle" fill="#484f58" font-size="10">history rewritten</text>
    <text x="56" y="320" text-anchor="start" fill="#484f58" font-size="10">replaces memorised git filter-branch invocations</text>
    <text x="56" y="340" text-anchor="start" fill="#484f58" font-size="10">ships as a Windows installer</text>
  </g>

  <g font-family="monospace" font-size="11" fill="#7d8590">
    <rect x="56" y="392" width="82" height="22" rx="3" fill="#21262d"/>
    <text x="97" y="407" text-anchor="middle">Electron</text>
    <rect x="146" y="392" width="96" height="22" rx="3" fill="#21262d"/>
    <text x="194" y="407" text-anchor="middle">JavaScript</text>
    <rect x="250" y="392" width="75" height="22" rx="3" fill="#21262d"/>
    <text x="287.5" y="407" text-anchor="middle">Node.js</text>
  </g>
</svg>
