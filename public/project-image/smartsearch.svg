<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="smartsearch — natural language query to optimized Google search URL, powered by llmbridge">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="#fbbf24"/>

  <text x="56" y="72" font-family="monospace" font-size="12" fill="#fbbf24" letter-spacing="4">WEB APPLICATION</text>
  <text x="56" y="120" font-family="monospace" font-size="42" font-weight="bold" fill="#e6edf3">smartsearch</text>
  <text x="56" y="152" font-family="monospace" font-size="15" fill="#7d8590">Type what you want. Get the right search URL.</text>

  <g font-family="monospace" font-size="10">
    <rect x="56" y="200" width="300" height="42" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="70" y="226" fill="#c9d1d9" font-size="9">"pdf papers on transformers, arxiv"</text>

    <path d="M356 221 H 394" stroke="#30363d" stroke-width="1.5"/>
    <rect x="394" y="196" width="90" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="439" y="217" text-anchor="middle" fill="#c9d1d9" font-size="10">Go API</text>
    <text x="439" y="234" text-anchor="middle" fill="#484f58" font-size="9">parse intent</text>

    <path d="M484 221 H 522" stroke="#30363d" stroke-width="1.5"/>
    <rect x="522" y="196" width="120" height="50" rx="6" fill="#0d1117" stroke="#fbbf24"/>
    <text x="582" y="217" text-anchor="middle" fill="#fbbf24" font-size="10">llmbridge</text>
    <text x="582" y="234" text-anchor="middle" fill="#484f58" font-size="9">swap at runtime</text>

    <path d="M582 246 V 284" stroke="#30363d" stroke-width="1.2"/>
    <rect x="56" y="284" width="586" height="42" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="70" y="309" fill="#fbbf24" font-size="9">google.com/search?q=transformers+site:arxiv.org+filetype:pdf</text>
  </g>

  <g font-family="monospace" font-size="11" fill="#7d8590">
    <rect x="56" y="392" width="42" height="22" rx="3" fill="#21262d"/><text x="77" y="407" text-anchor="middle">Go</text>
    <rect x="106" y="392" width="56" height="22" rx="3" fill="#21262d"/><text x="134" y="407" text-anchor="middle">React</text>
    <rect x="170" y="392" width="48" height="22" rx="3" fill="#21262d"/><text x="194" y="407" text-anchor="middle">Vite</text>
    <rect x="226" y="392" width="92" height="22" rx="3" fill="#21262d"/><text x="272" y="407" text-anchor="middle">Tailwind CSS</text>
  </g>
</svg>
