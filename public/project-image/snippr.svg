<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Snippr — self-hosted snippet manager with web UI, REST API, and CLI">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="#2dd4bf"/>

  <text x="56" y="72" font-family="monospace" font-size="12" fill="#2dd4bf" letter-spacing="4">WEB APPLICATION</text>
  <text x="56" y="120" font-family="monospace" font-size="42" font-weight="bold" fill="#e6edf3">Snippr</text>
  <text x="56" y="152" font-family="monospace" font-size="15" fill="#7d8590">Self-hosted snippets. Web, API, and CLI.</text>

  <g font-family="monospace" font-size="11">
    <!-- three clients -->
    <rect x="56" y="196" width="104" height="38" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="108" y="220" text-anchor="middle" fill="#c9d1d9">web UI</text>
    <rect x="56" y="244" width="104" height="38" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="108" y="268" text-anchor="middle" fill="#c9d1d9">Go CLI</text>
    <rect x="56" y="292" width="104" height="38" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="108" y="316" text-anchor="middle" fill="#c9d1d9">share link</text>

    <path d="M160 215 C 190 215, 190 262, 220 262" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <path d="M160 263 H 220" stroke="#30363d" stroke-width="1.5"/>
    <path d="M160 311 C 190 311, 190 264, 220 264" stroke="#30363d" stroke-width="1.5" fill="none"/>

    <!-- api -->
    <rect x="220" y="234" width="120" height="58" rx="6" fill="#0d1117" stroke="#2dd4bf"/>
    <text x="280" y="258" text-anchor="middle" fill="#2dd4bf" font-size="12">REST API</text>
    <text x="280" y="277" text-anchor="middle" fill="#484f58" font-size="10">JWT auth</text>

    <path d="M340 263 H 396" stroke="#30363d" stroke-width="1.5"/>
    <path d="M390 259 l6 4 -6 4z" fill="#30363d"/>

    <!-- postgres w/ tsvector -->
    <rect x="396" y="222" width="140" height="82" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="466" y="248" text-anchor="middle" fill="#c9d1d9">PostgreSQL</text>
    <line x1="410" y1="260" x2="522" y2="260" stroke="#21262d"/>
    <text x="466" y="278" text-anchor="middle" fill="#2dd4bf" font-size="10">tsvector</text>
    <text x="466" y="294" text-anchor="middle" fill="#484f58" font-size="9">full-text search</text>

    <!-- live board via SSE -->
    <path d="M536 250 C 570 250, 570 214, 604 214" stroke="#2dd4bf" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
    <rect x="604" y="192" width="140" height="44" rx="6" fill="#0d1117" stroke="#2dd4bf"/>
    <text x="674" y="212" text-anchor="middle" fill="#2dd4bf" font-size="11">live board</text>
    <text x="674" y="227" text-anchor="middle" fill="#484f58" font-size="9">SSE · realtime</text>

    <path d="M536 276 C 570 276, 570 310, 604 310" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <rect x="604" y="288" width="140" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="674" y="308" text-anchor="middle" fill="#c9d1d9" font-size="11">workspaces</text>
    <text x="674" y="323" text-anchor="middle" fill="#484f58" font-size="9">admin · member</text>
  </g>

  <g font-family="monospace" font-size="11" fill="#7d8590">
    <rect x="56" y="392" width="42" height="22" rx="3" fill="#21262d"/><text x="77" y="407" text-anchor="middle">Go</text>
    <rect x="106" y="392" width="56" height="22" rx="3" fill="#21262d"/><text x="134" y="407" text-anchor="middle">React</text>
    <rect x="170" y="392" width="82" height="22" rx="3" fill="#21262d"/><text x="211" y="407" text-anchor="middle">PostgreSQL</text>
    <rect x="260" y="392" width="62" height="22" rx="3" fill="#21262d"/><text x="291" y="407" text-anchor="middle">Docker</text>
    <rect x="330" y="392" width="92" height="22" rx="3" fill="#21262d"/><text x="376" y="407" text-anchor="middle">Tailwind CSS</text>
  </g>
</svg>
