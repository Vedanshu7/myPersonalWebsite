<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Lens — zero-SDK cache invalidation sidecar broadcasting across replicas">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="#a855f7"/>

  <text x="56" y="72" font-family="monospace" font-size="12" fill="#a855f7" letter-spacing="4">INFRASTRUCTURE</text>
  <text x="56" y="120" font-family="monospace" font-size="42" font-weight="bold" fill="#e6edf3">Lens</text>
  <text x="56" y="152" font-family="monospace" font-size="15" fill="#7d8590">Cache invalidation as a sidecar. Zero SDK.</text>

  <g font-family="monospace" font-size="11">
    <!-- pod A -->
    <rect x="56" y="204" width="176" height="96" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 3"/>
    <text x="66" y="222" fill="#484f58" font-size="10">pod A</text>
    <rect x="70" y="234" width="70" height="48" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="105" y="263" text-anchor="middle" fill="#c9d1d9">app</text>
    <rect x="150" y="234" width="70" height="48" rx="5" fill="#0d1117" stroke="#a855f7"/>
    <text x="185" y="257" text-anchor="middle" fill="#a855f7" font-size="10">lens</text>
    <text x="185" y="272" text-anchor="middle" fill="#484f58" font-size="9">:8900</text>

    <!-- pod B -->
    <rect x="568" y="204" width="176" height="96" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 3"/>
    <text x="578" y="222" fill="#484f58" font-size="10">pod B</text>
    <rect x="582" y="234" width="70" height="48" rx="5" fill="#0d1117" stroke="#a855f7"/>
    <text x="617" y="257" text-anchor="middle" fill="#a855f7" font-size="10">lens</text>
    <text x="617" y="272" text-anchor="middle" fill="#484f58" font-size="9">:8900</text>
    <rect x="662" y="234" width="70" height="48" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="697" y="263" text-anchor="middle" fill="#c9d1d9">app</text>

    <!-- broadcast arc between sidecars -->
    <path d="M220 246 C 300 176, 500 176, 582 246" stroke="#a855f7" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
    <circle cx="401" cy="196" r="3" fill="#a855f7"/>
    <text x="401" y="182" text-anchor="middle" fill="#a855f7" font-size="10">invalidate</text>

    <!-- pluggable providers -->
    <text x="401" y="332" text-anchor="middle" fill="#484f58" font-size="10" letter-spacing="2">SWAP AT CONFIG TIME</text>
    <rect x="250" y="344" width="72" height="24" rx="4" fill="#21262d"/><text x="286" y="360" text-anchor="middle" fill="#7d8590" font-size="10">transport</text>
    <rect x="330" y="344" width="72" height="24" rx="4" fill="#21262d"/><text x="366" y="360" text-anchor="middle" fill="#7d8590" font-size="10">discovery</text>
    <rect x="410" y="344" width="76" height="24" rx="4" fill="#21262d"/><text x="448" y="360" text-anchor="middle" fill="#7d8590" font-size="10">persist</text>
    <rect x="494" y="344" width="76" height="24" rx="4" fill="#21262d"/><text x="532" y="360" text-anchor="middle" fill="#7d8590" font-size="10">observe</text>
  </g>

  <g font-family="monospace" font-size="11" fill="#7d8590">
    <rect x="56" y="400" width="42" height="22" rx="3" fill="#21262d"/><text x="77" y="415" text-anchor="middle">Go</text>
    <rect x="106" y="400" width="52" height="22" rx="3" fill="#21262d"/><text x="132" y="415" text-anchor="middle">NATS</text>
    <rect x="166" y="400" width="50" height="22" rx="3" fill="#21262d"/><text x="191" y="415" text-anchor="middle">gRPC</text>
    <rect x="224" y="400" width="56" height="22" rx="3" fill="#21262d"/><text x="252" y="415" text-anchor="middle">Redis</text>
    <rect x="288" y="400" width="88" height="22" rx="3" fill="#21262d"/><text x="332" y="415" text-anchor="middle">Kubernetes</text>
    <rect x="384" y="400" width="104" height="22" rx="3" fill="#21262d"/><text x="436" y="415" text-anchor="middle">OpenTelemetry</text>
  </g>
</svg>
