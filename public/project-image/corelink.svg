<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Corelink — Go REST API for project and task management with Fiber, GORM, and PostgreSQL">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="#00ADD8"/>

  <text x="56" y="72" font-family="monospace" font-size="12" fill="#00ADD8" letter-spacing="4">REST API</text>
  <text x="56" y="120" font-family="monospace" font-size="42" font-weight="bold" fill="#e6edf3">Corelink</text>
  <text x="56" y="152" font-family="monospace" font-size="15" fill="#7d8590">Projects and tasks, over a clean REST surface.</text>

  <g font-family="monospace" font-size="11">
    <rect x="56" y="200" width="90" height="38" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="101" y="224" text-anchor="middle" fill="#c9d1d9">client</text>
    <path d="M146 219 H 184" stroke="#30363d" stroke-width="1.5"/>

    <rect x="184" y="192" width="130" height="54" rx="6" fill="#0d1117" stroke="#00ADD8"/>
    <text x="249" y="215" text-anchor="middle" fill="#00ADD8">Fiber</text>
    <text x="249" y="232" text-anchor="middle" fill="#484f58" font-size="9">JWT auth</text>

    <path d="M314 219 H 352" stroke="#30363d" stroke-width="1.5"/>
    <rect x="352" y="192" width="130" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="417" y="215" text-anchor="middle" fill="#c9d1d9">GORM</text>
    <text x="417" y="232" text-anchor="middle" fill="#484f58" font-size="9">ORM layer</text>

    <path d="M482 219 H 520" stroke="#30363d" stroke-width="1.5"/>
    <rect x="520" y="192" width="130" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="585" y="215" text-anchor="middle" fill="#c9d1d9">PostgreSQL</text>
    <text x="585" y="232" text-anchor="middle" fill="#484f58" font-size="9">projects · tasks</text>

    <!-- resource hierarchy -->
    <rect x="184" y="288" width="130" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="249" y="309" text-anchor="middle" fill="#c9d1d9" font-size="10">/projects</text>
    <path d="M249 322 V 344" stroke="#30363d" stroke-width="1.5"/>
    <rect x="184" y="344" width="130" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="249" y="365" text-anchor="middle" fill="#c9d1d9" font-size="10">/:id/tasks</text>

    <text x="352" y="300" fill="#484f58" font-size="10">POST · GET</text>
    <text x="352" y="316" fill="#484f58" font-size="10">PUT · DELETE</text>
  </g>

  <g font-family="monospace" font-size="11" fill="#7d8590">
    <rect x="56" y="392" width="42" height="22" rx="3" fill="#21262d"/><text x="77" y="407" text-anchor="middle">Go</text>
    <rect x="106" y="392" width="56" height="22" rx="3" fill="#21262d"/><text x="134" y="407" text-anchor="middle">Fiber</text>
    <rect x="170" y="392" width="82" height="22" rx="3" fill="#21262d"/><text x="211" y="407" text-anchor="middle">PostgreSQL</text>
    <rect x="260" y="392" width="46" height="22" rx="3" fill="#21262d"/><text x="283" y="407" text-anchor="middle">JWT</text>
    <rect x="314" y="392" width="62" height="22" rx="3" fill="#21262d"/><text x="345" y="407" text-anchor="middle">Docker</text>
  </g>
</svg>
