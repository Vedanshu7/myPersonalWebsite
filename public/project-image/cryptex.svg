<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Cryptex — Kafka event pipeline feeding OMS and EMS trading microservices">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="#22c55e"/>

  <text x="56" y="72" font-family="monospace" font-size="12" fill="#22c55e" letter-spacing="4">DISTRIBUTED SYSTEM</text>
  <text x="56" y="120" font-family="monospace" font-size="42" font-weight="bold" fill="#e6edf3">Cryptex</text>
  <text x="56" y="152" font-family="monospace" font-size="15" fill="#7d8590">Ticks to trades, through Kafka.</text>

  <!-- pipeline -->
  <g font-family="monospace" font-size="11">
    <!-- ticks -->
    <rect x="56" y="216" width="92" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="102" y="240" text-anchor="middle" fill="#c9d1d9">Binance</text>
    <text x="102" y="256" text-anchor="middle" fill="#484f58" font-size="10">100ms ws</text>

    <path d="M148 242 H 186" stroke="#30363d" stroke-width="1.5"/>
    <path d="M180 238 l6 4 -6 4z" fill="#30363d"/>

    <!-- kafka spine -->
    <rect x="186" y="196" width="150" height="92" rx="6" fill="#0d1117" stroke="#22c55e"/>
    <text x="261" y="220" text-anchor="middle" fill="#22c55e" font-size="12">Kafka</text>
    <line x1="200" y1="234" x2="322" y2="234" stroke="#21262d"/>
    <text x="261" y="250" text-anchor="middle" fill="#7d8590" font-size="10">candles · 5m OHLCV</text>
    <text x="261" y="268" text-anchor="middle" fill="#7d8590" font-size="10">trade-signals</text>

    <!-- signal sources -->
    <path d="M336 224 C 360 224, 360 176, 384 176" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <path d="M336 258 C 360 258, 360 306, 384 306" stroke="#30363d" stroke-width="1.5" fill="none"/>

    <rect x="384" y="156" width="106" height="40" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="437" y="181" text-anchor="middle" fill="#c9d1d9">LightGBM</text>

    <rect x="384" y="286" width="106" height="40" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="437" y="311" text-anchor="middle" fill="#c9d1d9">LLM signal</text>

    <!-- merge into OMS -->
    <path d="M490 176 C 516 176, 516 224, 540 224" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <path d="M490 306 C 516 306, 516 258, 540 258" stroke="#30363d" stroke-width="1.5" fill="none"/>

    <rect x="540" y="200" width="88" height="40" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="584" y="225" text-anchor="middle" fill="#c9d1d9">OMS</text>
    <rect x="540" y="248" width="88" height="40" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="584" y="273" text-anchor="middle" fill="#c9d1d9">EMS</text>
    <text x="584" y="308" text-anchor="middle" fill="#484f58" font-size="10">C# .NET 8</text>

    <path d="M628 244 H 664" stroke="#30363d" stroke-width="1.5"/>
    <path d="M658 240 l6 4 -6 4z" fill="#30363d"/>
    <rect x="664" y="216" width="80" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="704" y="240" text-anchor="middle" fill="#c9d1d9">Timescale</text>
    <text x="704" y="256" text-anchor="middle" fill="#484f58" font-size="10">DB</text>
  </g>

  <g font-family="monospace" font-size="11" fill="#7d8590">
    <rect x="56" y="392" width="60" height="22" rx="3" fill="#21262d"/><text x="86" y="407" text-anchor="middle">Python</text>
    <rect x="124" y="392" width="34" height="22" rx="3" fill="#21262d"/><text x="141" y="407" text-anchor="middle">C#</text>
    <rect x="166" y="392" width="50" height="22" rx="3" fill="#21262d"/><text x="191" y="407" text-anchor="middle">Kafka</text>
    <rect x="224" y="392" width="82" height="22" rx="3" fill="#21262d"/><text x="265" y="407" text-anchor="middle">PostgreSQL</text>
    <rect x="314" y="392" width="88" height="22" rx="3" fill="#21262d"/><text x="358" y="407" text-anchor="middle">Prometheus</text>
    <rect x="410" y="392" width="62" height="22" rx="3" fill="#21262d"/><text x="441" y="407" text-anchor="middle">Grafana</text>
  </g>
</svg>
