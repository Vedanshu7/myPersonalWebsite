<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Prism — end-to-end ML pipeline from raw data to a served FastAPI model">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="url(#spectrum)"/>

  <text x="56" y="72" font-family="monospace" font-size="12" fill="#3b82f6" letter-spacing="4">MACHINE LEARNING</text>
  <text x="56" y="120" font-family="monospace" font-size="42" font-weight="bold" fill="#e6edf3">Prism</text>
  <text x="56" y="152" font-family="monospace" font-size="15" fill="#7d8590">Raw data in. Served model out.</text>

  <g font-family="monospace" font-size="10">
    <!-- input beam -->
    <rect x="56" y="238" width="78" height="38" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="95" y="262" text-anchor="middle" fill="#c9d1d9" font-size="11">data</text>
    <path d="M134 257 H 178" stroke="#7d8590" stroke-width="2"/>

    <!-- the prism -->
    <path d="M182 292 L 224 214 L 266 292 Z" fill="#0d1117" stroke="#8b5cf6" stroke-width="1.5"/>

    <!-- refracted stages -->
    <path d="M266 268 H 320" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M266 258 H 320" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M266 248 H 320" stroke="#8b5cf6" stroke-width="1.5"/>
    <path d="M266 238 H 320" stroke="#a855f7" stroke-width="1.5"/>
    <path d="M266 228 H 320" stroke="#ec4899" stroke-width="1.5"/>

    <rect x="320" y="176" width="112" height="30" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="376" y="196" text-anchor="middle" fill="#c9d1d9">validate</text>
    <rect x="320" y="212" width="112" height="30" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="376" y="232" text-anchor="middle" fill="#c9d1d9">preprocess</text>
    <rect x="320" y="248" width="112" height="30" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="376" y="268" text-anchor="middle" fill="#c9d1d9">features</text>
    <rect x="320" y="284" width="112" height="30" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="376" y="304" text-anchor="middle" fill="#c9d1d9">train</text>
    <rect x="320" y="320" width="112" height="30" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="376" y="340" text-anchor="middle" fill="#c9d1d9">evaluate</text>

    <!-- converge to serve -->
    <path d="M432 191 C 470 191, 470 250, 508 250" stroke="#30363d" stroke-width="1.2" fill="none"/>
    <path d="M432 227 C 470 227, 470 250, 508 250" stroke="#30363d" stroke-width="1.2" fill="none"/>
    <path d="M432 263 H 508" stroke="#30363d" stroke-width="1.2"/>
    <path d="M432 299 C 470 299, 470 250, 508 250" stroke="#30363d" stroke-width="1.2" fill="none"/>
    <path d="M432 335 C 470 335, 470 250, 508 250" stroke="#30363d" stroke-width="1.2" fill="none"/>

    <rect x="508" y="222" width="122" height="58" rx="6" fill="#0d1117" stroke="#3b82f6"/>
    <text x="569" y="248" text-anchor="middle" fill="#3b82f6" font-size="12">FastAPI</text>
    <text x="569" y="266" text-anchor="middle" fill="#484f58">/predict</text>

    <text x="676" y="240" text-anchor="middle" fill="#484f58">RandomForest</text>
    <text x="676" y="256" text-anchor="middle" fill="#484f58">SVM · ElasticNet</text>
    <text x="676" y="272" text-anchor="middle" fill="#484f58">MLflow tracked</text>
  </g>

  <g font-family="monospace" font-size="11" fill="#7d8590">
    <rect x="56" y="392" width="60" height="22" rx="3" fill="#21262d"/><text x="86" y="407" text-anchor="middle">Python</text>
    <rect x="124" y="392" width="90" height="22" rx="3" fill="#21262d"/><text x="169" y="407" text-anchor="middle">scikit-learn</text>
    <rect x="222" y="392" width="68" height="22" rx="3" fill="#21262d"/><text x="256" y="407" text-anchor="middle">FastAPI</text>
    <rect x="298" y="392" width="60" height="22" rx="3" fill="#21262d"/><text x="328" y="407" text-anchor="middle">Pandas</text>
    <rect x="366" y="392" width="58" height="22" rx="3" fill="#21262d"/><text x="395" y="407" text-anchor="middle">NumPy</text>
  </g>
</svg>
