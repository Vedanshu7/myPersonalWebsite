<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="llmbridge — unified Go SDK and proxy for multiple LLM providers">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="3" fill="#00ADD8"/>

  <text x="56" y="72" font-family="monospace" font-size="12" fill="#00ADD8" letter-spacing="4">DEVELOPER TOOL</text>
  <text x="56" y="120" font-family="monospace" font-size="42" font-weight="bold" fill="#e6edf3">llmbridge</text>
  <text x="56" y="152" font-family="monospace" font-size="15" fill="#7d8590">One Go interface. Every LLM provider.</text>

  <!-- fan-out: single client -> router -> providers -->
  <g font-family="monospace" font-size="12">
    <rect x="56" y="212" width="112" height="46" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="112" y="240" text-anchor="middle" fill="#e6edf3">your app</text>

    <path d="M168 235 H 236" stroke="#30363d" stroke-width="1.5"/>

    <rect x="236" y="204" width="104" height="62" rx="6" fill="#0d1117" stroke="#00ADD8"/>
    <text x="288" y="230" text-anchor="middle" fill="#00ADD8">router</text>
    <text x="288" y="250" text-anchor="middle" fill="#7d8590" font-size="10">failover</text>

    <!-- fan out lines -->
    <path d="M340 235 C 380 235, 380 116, 420 116" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <path d="M340 235 C 380 235, 380 176, 420 176" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <path d="M340 235 C 380 235, 380 236, 420 236" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <path d="M340 235 C 380 235, 380 296, 420 296" stroke="#30363d" stroke-width="1.5" fill="none"/>
    <path d="M340 235 C 380 235, 380 356, 420 356" stroke="#30363d" stroke-width="1.5" fill="none"/>

    <rect x="420" y="98"  width="150" height="36" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="440" y="121" fill="#c9d1d9">OpenAI</text>
    <rect x="420" y="158" width="150" height="36" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="440" y="181" fill="#c9d1d9">Anthropic</text>
    <rect x="420" y="218" width="150" height="36" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="440" y="241" fill="#c9d1d9">Gemini</text>
    <rect x="420" y="278" width="150" height="36" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="440" y="301" fill="#c9d1d9">Bedrock</text>
    <rect x="420" y="338" width="150" height="36" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="440" y="361" fill="#c9d1d9">Ollama</text>

    <text x="590" y="241" fill="#484f58" font-size="11">+ Groq, Cohere,</text>
    <text x="590" y="258" fill="#484f58" font-size="11">Azure, any OAI-</text>
    <text x="590" y="275" fill="#484f58" font-size="11">compatible</text>
  </g>

  <g font-family="monospace" font-size="11" fill="#7d8590">
    <rect x="56" y="392" width="42" height="22" rx="3" fill="#21262d"/><text x="77" y="407" text-anchor="middle">Go</text>
    <rect x="106" y="392" width="56" height="22" rx="3" fill="#21262d"/><text x="134" y="407" text-anchor="middle">Redis</text>
    <rect x="170" y="392" width="88" height="22" rx="3" fill="#21262d"/><text x="214" y="407" text-anchor="middle">Prometheus</text>
    <rect x="266" y="392" width="62" height="22" rx="3" fill="#21262d"/><text x="297" y="407" text-anchor="middle">Docker</text>
    <rect x="336" y="392" width="88" height="22" rx="3" fill="#21262d"/><text x="380" y="407" text-anchor="middle">Kubernetes</text>
  </g>
</svg>
